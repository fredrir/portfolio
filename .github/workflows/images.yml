name: Build images
'on':
  push:
    branches:
    - main
    paths-ignore:
    - "README.md"
    - "docs/**"
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/portfolio-api
      context: .
      check-target: check-reports
      dockerfile: Containerfile
      target: api
      timeout-minutes: 150
      build-args: APP_VERSION=${{ github.sha }}
  web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/portfolio-web
      context: .
      check-target: check-reports
      dockerfile: apps/web/Dockerfile
      timeout-minutes: 150
      build-args: 'VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}

        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}

        VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}

        VITE_APP_VERSION=${{ github.sha }}'
  worker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/portfolio-worker
      context: .
      check-target: check-reports
      dockerfile: Containerfile
      target: worker
      timeout-minutes: 150
      build-args: APP_VERSION=${{ github.sha }}
