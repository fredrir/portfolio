name: Build images
'on':
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@1f2eecbc81ba184252f9ed85f893fa5eb3b5150a
    with:
      image: ghcr.io/fredrir/portfolio-api
      context: .
      dockerfile: apps/api/Dockerfile
      timeout-minutes: 150
      test-command: 'bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile rust-tests

        bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile quality-tests --opt build-arg:CI_REVISION="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"'
      build-args: APP_VERSION=${{ github.sha }}
  web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@1f2eecbc81ba184252f9ed85f893fa5eb3b5150a
    with:
      image: ghcr.io/fredrir/portfolio-web
      context: .
      dockerfile: apps/web/Dockerfile
      timeout-minutes: 150
      test-command: bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile web-tests
      build-args: 'VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}

        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}

        VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}

        VITE_APP_VERSION=${{ github.sha }}'
  worker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@1f2eecbc81ba184252f9ed85f893fa5eb3b5150a
    with:
      image: ghcr.io/fredrir/portfolio-worker
      context: .
      dockerfile: apps/worker/Dockerfile
      timeout-minutes: 150
      test-command: 'bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile rust-tests

        bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile quality-tests --opt build-arg:CI_REVISION="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"'
      build-args: APP_VERSION=${{ github.sha }}
