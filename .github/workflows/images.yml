name: Build images
'on':
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@b2c97f0c98c09099d19696089e55f1e95bd6ac1d
    with:
      image: ghcr.io/fredrir/portfolio-api
      context: .
      dockerfile: apps/api/Dockerfile
      timeout-minutes: 150
      test-command: 'infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target rust-tests --check-only --timeout 150m

        infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target quality-tests --check-only --timeout 150m --build-arg "CI_REVISION=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"'
      build-args: APP_VERSION=${{ github.sha }}
  web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@b2c97f0c98c09099d19696089e55f1e95bd6ac1d
    with:
      image: ghcr.io/fredrir/portfolio-web
      context: .
      dockerfile: apps/web/Dockerfile
      timeout-minutes: 150
      test-command: infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target web-tests --check-only --timeout 150m
      build-args: 'VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}

        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}

        VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}

        VITE_APP_VERSION=${{ github.sha }}'
  worker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@b2c97f0c98c09099d19696089e55f1e95bd6ac1d
    with:
      image: ghcr.io/fredrir/portfolio-worker
      context: .
      dockerfile: apps/worker/Dockerfile
      timeout-minutes: 150
      test-command: 'infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target rust-tests --check-only --timeout 150m

        infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target quality-tests --check-only --timeout 150m --build-arg "CI_REVISION=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"'
      build-args: APP_VERSION=${{ github.sha }}
