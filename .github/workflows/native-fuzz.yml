name: Fuzzing
on:
  schedule:
    - cron: 0 3 * * 6
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository_owner_id == '114402558'
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: apps/api
            target: sanitize
          - crate: apps/api
            target: contact_validate
          - crate: apps/worker
            target: s3_event_parse
    uses: fredrir/infra/.github/workflows/test-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      target: fuzz-results
      artifact: fuzz-${{ matrix.target }}
      build-args: '{"FUZZ_CRATE":"${{ matrix.crate }}","FUZZ_TARGET":"${{ matrix.target }}"}'
      report-check: test "$(cat "$RUNNER_TEMP/reports/exit-code")" = 0
