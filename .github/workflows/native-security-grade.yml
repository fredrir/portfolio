name: Security grade
'on':
  schedule:
  - cron: 0 4 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observatory:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected && github.repository_owner_id == '114402558'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Check Observatory, TLS and headers
      run: "set -Eeuo pipefail\nresult=$(curl --fail --silent --show-error --max-time 60 -X POST 'https://observatory-api.mdn.mozilla.net/api/v2/scan?host=hansteen.dev')\n\
        jq -e '{grade, score}, (.grade as $grade | [\"B\", \"B+\", \"A-\", \"A\", \"A+\"] | index($grade) != null)'\
        \ <<< \"$result\"\nheaders=$(curl --fail --silent --show-error --max-time 30 -I -A synthetic https://hansteen.dev/en)\n\
        grep -qi 'strict-transport-security' <<< \"$headers\"\ngrep -qi 'content-security-policy' <<< \"$headers\"\
        \ngrep -qi 'x-content-type-options: nosniff' <<< \"$headers\"\ngrep -qi 'alt-svc: h3' <<< \"$headers\"\n\
        if curl --silent --show-error --max-time 15 --tls-max 1.1 -o /dev/null https://hansteen.dev/ 2>/dev/null;\
        \ then\n  echo 'legacy TLS accepted' >&2\n  exit 1\nfi\n"
