name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@portfolio/web' typecheck
      - run: cargo test --workspace

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ghcr.io/fredrir/portfolio-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/fredrir/portfolio-${{ matrix.image }}@${{ steps.build.outputs.digest }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Deploy via forced-command SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          install -m 600 /dev/null known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i key \
            -o UserKnownHostsFile=known_hosts \
            -o IdentitiesOnly=yes \
            "portfolio@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Record failed deployment status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<EOF
          {"ref":"$GITHUB_SHA","environment":"production","auto_merge":false,"required_contexts":[]}
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=failure \
            -f environment=production \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record GitHub deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<EOF
          {"ref":"$GITHUB_SHA","environment":"production","auto_merge":false,"required_contexts":[]}
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=success \
            -f environment=production \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  edge:
    needs: [deploy]
    runs-on: ubuntu-latest
    # Requires a Cloudflare API token with Workers Scripts:Edit +
    # Workers Routes:Edit stored as CLOUDFLARE_WORKERS_API_TOKEN.
    if: vars.EDGE_CD_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy edge Worker
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: bunx wrangler deploy
