name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Auto-incrementing semantic version from the latest v-tag (baseline 3.0.0).
  # Conventional commits since that tag decide the bump: BREAKING/`!` → major,
  # feat → minor, otherwise patch. Idempotent: a commit already tagged reuses
  # its tag so re-runs don't inflate the version.
  version:
    # Only main reaches production (guards manual workflow_dispatch on any ref).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: compute
        run: |
          set -euo pipefail
          EXISTING=$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$EXISTING" ]; then
            NEXT="${EXISTING#v}"
            echo "HEAD already tagged $EXISTING"
          else
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              NEXT="3.0.0"
            else
              BASE=${LATEST#v}; MAJ=${BASE%%.*}; REST=${BASE#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
              LOG=$(git log --format='%s%n%b' "${LATEST}..HEAD")
              if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$LOG" || grep -qiE 'BREAKING[ -]CHANGE' <<<"$LOG"; then
                MAJ=$((MAJ+1)); MIN=0; PAT=0
              elif grep -qE '^feat(\([^)]*\))?:' <<<"$LOG"; then
                MIN=$((MIN+1)); PAT=0
              else
                PAT=$((PAT+1))
              fi
              NEXT="${MAJ}.${MIN}.${PAT}"
            fi
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "resolved version: v$NEXT"
          # The tag is created by the release job only after a successful
          # deploy, so a failed build never burns a version number.

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@portfolio/web' typecheck
      - run: bun run --filter '@portfolio/edge' typecheck
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ghcr.io/fredrir/portfolio-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.version.outputs.version }}
            VITE_APP_VERSION=${{ needs.version.outputs.version }}
            VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/fredrir/portfolio-${{ matrix.image }}@${{ steps.build.outputs.digest }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Deploy via forced-command SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          install -m 600 /dev/null known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i key \
            -o UserKnownHostsFile=known_hosts \
            -o IdentitiesOnly=yes \
            "portfolio@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Record failed deployment status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<EOF
          {"ref":"$GITHUB_SHA","environment":"production","auto_merge":false,"required_contexts":[]}
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=failure \
            -f environment=production \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record GitHub deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<EOF
          {"ref":"$GITHUB_SHA","environment":"production","auto_merge":false,"required_contexts":[]}
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=success \
            -f environment=production \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release:
    needs: [version, deploy]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already published"
            exit 0
          fi
          # Creates the tag at this exact deployed commit AND the release in one
          # step — the tag only ever exists for a release that reached production.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Deployed to production from \`${GITHUB_SHA}\`. Images: \`ghcr.io/fredrir/portfolio-{web,api,worker}:${GITHUB_SHA}\` (SBOM + provenance attested, keyless-Cosign signed, signature-verified on the host)."

  edge:
    needs: [checks, deploy]
    runs-on: ubuntu-latest
    # Requires a Cloudflare API token with Workers Scripts:Edit +
    # Workers Routes:Edit stored as CLOUDFLARE_WORKERS_API_TOKEN.
    if: vars.EDGE_CD_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@portfolio/edge' typecheck
      - name: Deploy edge Worker
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: bunx wrangler deploy
      - name: Smoke the edge route
        run: |
          set -e
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://hansteen.dev/en)
          echo "apex /en -> $code"
          [ "$code" = "200" ]
