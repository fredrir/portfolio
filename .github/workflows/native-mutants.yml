name: Mutation testing
on:
  schedule:
    - cron: 0 2 * * 6
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutants:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository_owner_id == '114402558'
    uses: fredrir/infra/.github/workflows/test-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      target: mutation-results
      artifact: mutants-report
      timeout-minutes: 55
      report-check: |
        test -s "$RUNNER_TEMP/reports/mutants.out/outcomes.json"
        case "$(cat "$RUNNER_TEMP/reports/exit-code")" in
          0|2|3) ;;
          *) exit 1 ;;
        esac
