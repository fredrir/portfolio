services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 + SQS for the media pipeline.
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: eu-north-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name media-processing"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Production-like app containers; start with: docker compose --profile app up --build
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
      API_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8080
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    profiles: ["app"]

volumes:
  db-data:
