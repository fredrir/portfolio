[package]
name = "portfolio-api"
version = "0.1.0"
default-run = "portfolio-api"
edition.workspace = true
license.workspace = true

[lib]
name = "portfolio_api"

[dependencies]
aws-config = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
axum = "0.8"
dotenvy = "0.15"
hex = "0.4"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form"] }
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "time",
    "uuid",
] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
