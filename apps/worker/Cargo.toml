[package]
name = "portfolio-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "portfolio_worker"

[dependencies]
aws-config = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
dotenvy = "0.15"
hex = "0.4"
image = { version = "0.25", features = ["avif"] }
kamadak-exif = "0.6"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "time",
    "uuid",
] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde"] }
webp = "0.3"

[dev-dependencies]
proptest = "1"
